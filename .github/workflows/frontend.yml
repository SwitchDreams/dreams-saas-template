name: Frontend CI
on:
  pull_request:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@master
        with:
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@switchdreams'

      - name: Install modules
        run: yarn
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Run ESLint
        run: yarn lint
      - name: Run Tests
        env:
          TZ: "America/Sao_Paulo"
        run: yarn vitest